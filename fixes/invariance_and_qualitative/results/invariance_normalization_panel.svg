<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="340" viewBox="0 0 1150 340"><rect width="100%" height="100%" fill="white"/><text x="32" y="38" font-size="22" font-family="Arial, sans-serif" font-weight="700">Strict representation check: one primitive repeat</text><text x="32" y="62" font-size="15" font-family="Arial, sans-serif" fill="#555">Translated and repeated PEO forms normalize before model inference</text><circle cx="38" cy="80" r="10" fill="#1b9e77"/><text x="64" y="86" font-size="18" font-family="Arial, sans-serif">monomer: *CCO*  →  *CCO*</text><circle cx="38" cy="136" r="10" fill="#7570b3"/><text x="64" y="142" font-size="18" font-family="Arial, sans-serif">translated cut-point: *OCC*  →  *CCO*</text><circle cx="38" cy="192" r="10" fill="#d95f02"/><text x="64" y="198" font-size="18" font-family="Arial, sans-serif">dimer: *CCOCCO*  →  *CCO*</text><circle cx="38" cy="248" r="10" fill="#66a61e"/><text x="64" y="254" font-size="18" font-family="Arial, sans-serif">trimer: *CCOCCOCCO*  →  *CCO*</text></svg>